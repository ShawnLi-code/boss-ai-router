<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Boss AI Router · 启动中</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }
    .boot-box {
      text-align: center;
      padding: 28px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 14px;
      border-radius: 50%;
      border: 3px solid rgba(99, 102, 241, 0.25);
      border-top-color: #6366f1;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 6px 0 0; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="boot-box">
    <div class="spinner"></div>
    <strong>Boss AI Router</strong>
    <p id="status">正在连接本地风控与 Ego 调度引擎...</p>
  </div>
</body>
</html>
